name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    uses: bazel-contrib/.github/.github/workflows/bazel.yaml@v7.4.0
    with:
      bazel_versions: '["9.x", "8.x", "7.x"]'
      # tools/preset.bazelrc must remain valid for the oldest Bazel in the matrix, while
      # bazelrc-preset's generated output depends on the running Bazel version. The diff test
      # cannot pass on every matrix cell at once, so it is excluded here and checked in
      # tools-preset-bazelrc using the repo's .bazelversion (via Bazelisk) as the canonical preset.
      bazel_test_command: "bazel test //... -- -//tools:preset.update_test"
      folders: |
        [
          "."
        ]
      exclude: |
        [
          {"folder": ".", "bzlmodEnabled": false},
          {"folder": ".", "bazelversion": "6.4.0"}
        ]
  tools-preset-bazelrc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # 0.18.0
        with:
          repository-cache: true
          bazelrc: |
            common --announce_rc
            common --color=yes
            common --enable_bzlmod=true
      - name: Verify tools/preset.bazelrc is current
        run: bazel test //tools:preset.update_test
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pre-commit/action@v3.0.1
  # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
  # on "all matrix jobs were successful".
  conclusion:
    needs: [test, pre-commit, tools-preset-bazelrc]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # v3.0.3
      # Note: possible conclusion values:
      # https://github.com/technote-space/workflow-conclusion-action/blob/main/src/constant.ts
      - name: report success
        if: ${{ env.WORKFLOW_CONCLUSION == 'success' }}
        working-directory: /tmp
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 0
      - name: report failure
        if: ${{ env.WORKFLOW_CONCLUSION == 'failure' }}
        working-directory: /tmp
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 1
